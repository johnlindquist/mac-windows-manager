name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: macos-latest
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '5.10'
    
    - name: Import Code-Signing Certificates
      uses: apple-actions/import-codesign-certs@v3
      with:
        p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
        p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
    
    - name: Build and Sign
      env:
        CERTIFICATE_NAME: ${{ secrets.CERTIFICATE_NAME }}
      run: |
        echo "Building the project..."
        swift build -c release
        echo "Moving binary to current directory..."
        mv .build/release/mwm ./mwm
        
        echo "Creating entitlements file..."
        cat << EOF > entitlements.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
          <true/>
        </dict>
        </plist>
        EOF
        
        echo "Listing available signing identities..."
        security find-identity -v -p codesigning
        
        echo "Attempting to sign the binary..."
        /usr/bin/codesign --force -s "${{ secrets.DEVELOPER_ID_APPLICATION }}" --options runtime --entitlements entitlements.plist -v ./mwm
        
        echo "Verifying code signature..."
        /usr/bin/codesign -dv --verbose=4 ./mwm

    - name: Check Binary Structure
      run: |
        echo "Binary information:"
        file ./mwm
        echo "Binary structure:"
        otool -l ./mwm | grep -A 2 LC_CODE_SIGNATURE
        echo "Directory structure:"
        ls -R ./

    - name: Notarize
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        echo "Creating ZIP for notarization..."
        ditto -c -k --keepParent ./mwm mwm.zip
        
        echo "Submitting for notarization..."
        NOTARIZATION_RESULT=$(xcrun notarytool submit mwm.zip --wait --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$TEAM_ID" --output-format json)
        echo "$NOTARIZATION_RESULT" > notarization_result.json
        
        echo "Notarization result:"
        cat notarization_result.json
        
        SUBMISSION_ID=$(echo "$NOTARIZATION_RESULT" | jq -r '.id')
        echo "SUBMISSION_ID=$SUBMISSION_ID" >> $GITHUB_ENV
        
        if echo "$NOTARIZATION_RESULT" | grep -q '"status":"Accepted"'; then
          echo "Notarization successful"
          echo "Verifying binary..."
          spctl --assess -vv ./mwm || echo "Warning: Binary verification failed. This may require further investigation."
        else
          echo "Notarization failed. Check the output above for details."
          exit 1
        fi

    - name: Check Notarization Status
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        echo "Checking notarization status..."
        xcrun notarytool info ${{ env.SUBMISSION_ID }} --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$TEAM_ID"
    
    - name: Generate SHA256
      id: shasum
      run: echo "sha256=$(shasum -a 256 mwm | awk '{ print $1 }')" >> $GITHUB_OUTPUT
    
    - name: Write SHA256 file
      run: |
        echo "${{ steps.shasum.outputs.sha256 }}  mwm" > mwm.sha256
    
    - name: Release
      id: release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          mwm
          mwm.sha256
          notarization_result.json
        generate_release_notes: true

    - name: Set up Git Credentials for Tap Repo
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Check out Homebrew Tap Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/homebrew-mwm
        path: homebrew-tap
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    - name: Generate Homebrew Formula
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        SHA256="${{ steps.shasum.outputs.sha256 }}"
        DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/mwm"
        REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
        REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)

        echo "Version: $VERSION"
        echo "SHA256: $SHA256"
        echo "Download URL: $DOWNLOAD_URL"
        echo "Repo Owner: $REPO_OWNER"
        echo "Repo Name: $REPO_NAME"

        mkdir -p homebrew-tap/Formula

        cat << EOF > homebrew-tap/Formula/mwm.rb
        # typed: false
        # frozen_string_literal: true

        class Mwm < Formula
          desc "Powerful macOS command-line tool for window management"
          homepage "https://github.com/$REPO_OWNER/$REPO_NAME"
          url "$DOWNLOAD_URL"
          version "$VERSION"
          sha256 "$SHA256"
          license "MIT"

          def install
            bin.install "mwm"
          end

          test do
            system "#{bin}/mwm", "--help"
          end
        end
        EOF

        echo "Generated homebrew-tap/Formula/mwm.rb"
        cat homebrew-tap/Formula/mwm.rb

    - name: Commit and Push Formula Update to Tap Repo
      run: |
        cd homebrew-tap
        git add Formula/mwm.rb
        if git diff --staged --quiet; then
          echo "No changes to the formula file. Skipping commit."
        else
          git commit -m "Update mwm formula to version ${{ github.ref_name }}"
          git push origin main
          echo "Pushed updated formula to tap repository."
        fi
      env:
        GIT_AUTHOR_NAME: ${{ github.actor }}
        GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        GIT_COMMITTER_NAME: ${{ github.actor }}
        GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com